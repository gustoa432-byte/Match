<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080a15" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Neon Cosmic Circles -->
  <circle cx="380" cy="130" r="90" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />
  <circle cx="130" cy="380" r="110" fill="#d946ef" opacity="0.15" filter="url(#glow)" />

  <!-- Math Symbols Composition -->
  <!-- Plus Symbol -->
  <g filter="url(#glow)">
    <rect x="130" y="160" width="80" height="20" rx="10" fill="url(#neonCyan)" />
    <rect x="160" y="130" width="20" height="80" rx="10" fill="url(#neonCyan)" />
  </g>

  <!-- Multiply Symbol (X) -->
  <g transform="translate(330, 170) rotate(45)" filter="url(#glow)">
    <rect x="-40" y="-10" width="80" height="20" rx="10" fill="url(#neonPink)" />
    <rect x="-10" y="-40" width="20" height="80" rx="10" fill="url(#neonPink)" />
  </g>

  <!-- Division Symbol -->
  <g filter="url(#glow)">
    <rect x="130" y="335" width="80" height="20" rx="10" fill="url(#neonPink)" />
    <circle cx="170" cy="295" r="10" fill="url(#neonPink)" />
    <circle cx="170" cy="395" r="10" fill="url(#neonPink)" />
  </g>

  <!-- Equals / Minus Symbol -->
  <g filter="url(#glow)">
    <rect x="300" y="325" width="80" height="18" rx="9" fill="url(#neonCyan)" />
    <rect x="300" y="360" width="80" height="18" rx="9" fill="url(#neonCyan)" />
  </g>

  <!-- Center Thunderbolt / Sparkle -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
</svg>
