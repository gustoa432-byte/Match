name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install --save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mental-Math-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
