name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android Environment & Licenses
        run: |
          # Создаем директории для Android и Keystore и выставляем права пользователя runner
          mkdir -p "$HOME/.android" "$HOME/.config/.android" "$ANDROID_HOME/licenses"
          sudo chown -R $USER:$USER "$HOME" || true
          chmod -R 775 "$HOME/.android" "$HOME/.config" || true

          # Генерируем стандартный debug.keystore заранее, чтобы исключить ошибку прав доступа
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true
          cp -f "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore" || true
          chmod 664 "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore" || true

          # Принимаем все лицензии Android SDK от имени текущего пользователя (без sudo)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mental-Math-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
